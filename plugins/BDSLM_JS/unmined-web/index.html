<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <title>实况地图 - 雁栖岛服务器</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <!-- OpenLayers -->
    <link rel="stylesheet" type="text/css" href="assets/css/cdn/layui.css">
    <link rel="stylesheet" type="text/css" href="assets/css/cdn/ol.css">
    <link rel="stylesheet" type="text/css" href="assets/css/cdn/motd.css">
    <link rel="stylesheet" type="text/css" href="assets/css/unmined.index.css"> 
</head>

<body>
    <div id="map"></div>
    <div class="message-box" id="message-box" style="display: none">
        <div class="message-history-container" id="message-history-container" style="display: none">
            <div id="login-form">
                <div class="input-column">
                    <input type="text" id="username" placeholder="XboxID" title="密码在游戏内使用命令/bdslm设置"/>
                    <input type="password" id="password" placeholder="密码(服内使用/bdslm设置)" title="密码在游戏内使用命令/bdslm设置"/>
                </div>
                <div class="button-column">
                    <div>
                        <input type="checkbox" id="remember-me" />
                        <label for="remember-me">自动登录</label>
                    </div>
                    <button id="login-button">登录</button>
                </div>
            </div>
            <!-- 显示登录状态 -->
            <div id="login-status" style="display: none">
                <div id="login-status-str"></div>
                <div id="logout-button">登出</div>
            </div>
            <div class="message-navbar" id="message-navbar">
                <div class="message-option-chat" data-target="message-history"
                    style="background-color: #000;color:#fff;">聊天</div>
                <div class="message-option-playerlist" data-target="message-playerlist">玩家列表</div>
                <div class="message-option-web" data-target="message-webOnline">网页在线</div>
            </div>
            <div class="message-display-container" id="message-display-container">
                <div class="message-history" id="message-history"></div>
                <div class="message-playerlist" id="message-playerlist" style="display: none"></div>
                <div class="message-webOnline" id="message-webOnline" style="display: none"></div>
            </div>
        </div>

        <div class="message-lastmsg" id="message-lastmsg"></div>
        <div class="message-input-container" id="message-input-container" style="display: none">
            <input class="message-input" id="message-input" />
            <button class="message-send-button" id="message-send-button">发送</button>
        </div>

    </div>
    <div id="markerMenu" style = "background:orange;display: none;"><button>传送</button></div>


    <script src="assets/js/cdn/jquery-3.7.1.min.js"></script>
    <script src="assets/js/cdn/motd.js" type="text/javascript"></script>

    <!-- ui -->
    <script type="text/javascript" src="assets/js/cdn/layui.js"></script>
    <!-- OpenLayers -->
    <script type="text/javascript" src="assets/js/cdn/ol.js"></script>
     <!-- OpenLayers Context Menu -->
     <link href="assets/css/cdn/ol-contextmenu.css" rel="stylesheet">
     <script src="assets/js/cdn/ol-contextmenu.iife.js"></script>
 
     <!-- Toastify -->
     <script type="text/javascript" src="assets/js/cdn/toastify-js.js"></script>
     <link rel="stylesheet" type="text/css" href="assets/css/cdn/toastify-js.min.css">
    
    <!-- Map metadata generated by uNmINeD -->
    <script type="text/javascript" src="unmined.map.properties.js"></script>
    <script type="text/javascript" src="unmined.map.regions.js"></script>
    <script type="text/javascript" src="unmined.map.players.js"></script>
    <!-- Custom markers -->
    <script type="text/javascript" src="custom.markers.js"></script>

    <!-- uNmINeD JS -->
    <script type="text/javascript" src="assets/js/unminded.controlbutton.js"></script>
    

    <script type="text/javascript" src="assets/js/init-conf.js"></script>
    <script type="text/javascript" src="assets/js/bdslm-document-title.js"></script>

    <script type="text/javascript" src="unmined.js"></script>
    <script type="text/javascript" src="assets/js/bdslm-marker-label-chip.js"></script>
    <script type="text/javascript" src="assets/js/custom-openlayers.js"></script>
</body>
</html>
